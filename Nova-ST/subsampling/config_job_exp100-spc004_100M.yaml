  seq2nd:
  - fastq_R1: /staging/leuven/stg_00143/julienm/nova-st/data/2024-07-UTBenchmark-SpC/Exp100-sampleSPC004_100M/input/5147/5147_03_Exp100_SPC004_S7_L001_R1_001.fastq.gz
    fastq_R2: /staging/leuven/stg_00143/julienm/nova-st/data/2024-07-UTBenchmark-SpC/Exp100-sampleSPC004_100M/input/5147/5147_03_Exp100_SPC004_S7_L001_R2_001.fastq.gz
  - fastq_R1: /staging/leuven/stg_00143/julienm/nova-st/data/2024-07-UTBenchmark-SpC/Exp100-sampleSPC004_100M/input/5147/5147_03_Exp100_SPC004_S7_L002_R1_001.fastq.gz
    fastq_R2: /staging/leuven/stg_00143/julienm/nova-st/data/2024-07-UTBenchmark-SpC/Exp100-sampleSPC004_100M/input/5147/5147_03_Exp100_SPC004_S7_L002_R2_001.fastq.gz

output: "/staging/leuven/stg_00143/julienm/nova-st/data/2024-07-UTBenchmark-SpC/Exp100-sampleSPC004_100M/novascope_output"

# Kris Davie only requests sge-per-run and transcript-per-unit
# sbcd-per-chip is optional, outputs a spatial barcode distribution image of the chip
request:
- sge-per-run
- transcript-per-unit
#- histology-per-run
#- segment-10x-per-unit
#- sbcd-per-chip  

upstream:
  # For the NovaSeq6000_20241107 flowcell, the upstream / fastq2sbcd / format has the default value DraI32
  smatch:
    skip_sbcd: 0
  visualization:
    drawsge:
      action: true
      genes:
      - blue: MT
        green: Unspliced
        red: nonMT
    resource:
      assign_type: stdin
      stdin:
        threads: 60
